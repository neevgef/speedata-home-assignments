name: Build
on:
  push:
    branches:
      - main
    paths:
      - app/**

jobs:
  build-frontend:
    uses: ./.github/workflows/build-app.yml
    with:
      image_name: skywatch-frontend
      context: app/frontend
    if: github.path == 'app/frontend/**' || github.ref == 'refs/heads/main'
  build-backend:
    uses: ./.github/workflows/build-app.yml
    with:
      image_name: skywatch-backend
      context: app/backend
    if: github.path == 'app/backend/**' || github.ref == 'refs/heads/main'
  