name: Lint Application
on:
  workflow_call:
    inputs:
      context:
        required: true
        type: string

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Check out the repository
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Use pylint to lint the code
        run: |
          pip install pylint
          pip install -r ${{ inputs.context }}/requirements.txt
          pylint ${{ inputs.context }} 