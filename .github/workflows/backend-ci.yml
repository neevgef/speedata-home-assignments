name: Build and Deploy Backend
on:
  push:
    branches:
      - main
    paths:
      - app/backend/**
  pull_request:
    branches:
      - main
    paths:
      - app/backend/**
  workflow_dispatch:

jobs:
  lint-backend:
    uses: ./.github/workflows/lint-app.yml
    with:
      context: app/backend
  build-backend:
    needs: lint-backend
    permissions:
      packages: write
      contents: write
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: backend
      image_name: skywatch-backend
      context: app/backend
  