apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skywatch
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/neevgef/speedata-home-assignments.git
    targetRevision: main
    path: deploy/helm
    helm:
      releaseName: skywatch
  destination:
    server: https://kubernetes.default.svc
    namespace: skywatch
  syncPolicy:
    automated:
      prune: true
      selfHeal: true