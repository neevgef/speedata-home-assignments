apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "skywatch.fullname" . }}-frontend
  labels:
    {{- include "skywatch.labels" (dict "root" . "app" "frontend") | nindent 4 }}
data:
  BACKEND_URL: {{ .Values.frontend.backendUrl | default (printf "http://%s-backend:%v/weather" (include "skywatch.fullname" .) .Values.backend.service.port) | quote }}
