apiVersion: v1
kind: Service
metadata:
  name: {{ include "skywatch.fullname" . }}-backend
  labels:
    {{- include "skywatch.labels" (dict "root" . "app" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "skywatch.selectorLabels" (dict "root" . "app" "backend") | nindent 4 }}
