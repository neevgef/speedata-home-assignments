apiVersion: v1
kind: Service
metadata:
  name: {{ include "skywatch.fullname" . }}-frontend
  labels:
    {{- include "skywatch.labels" (dict "root" . "app" "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
  selector:
    {{- include "skywatch.selectorLabels" (dict "root" . "app" "frontend") | nindent 4 }}
