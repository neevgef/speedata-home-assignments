---
- hosts: servers
  become: true
  vars:
    ansible_ssh_private_key_file: "~/.ssh/{{inventory_hostname}}_private_key"
  roles:
    - { role: control-plane }

- hosts: agents
  become: true
  vars:
    ansible_ssh_private_key_file: "~/.ssh/{{inventory_hostname}}_private_key"
  roles:
    - { role: worker-nodes }

- hosts: k3s_cluster
  become: true
  vars:
    ansible_ssh_private_key_file: "~/.ssh/{{inventory_hostname}}_private_key"
  tasks:
    - name: Allow Flannel VXLAN traffic between cluster nodes
      community.general.ufw:
        rule: allow
        from_ip: "{{ hostvars[hostname].ansible_host }}"
        to_ip: any
        port: 8472
        proto: udp
      loop: "{{ groups['k3s_cluster'] | difference([inventory_hostname]) }}"
      loop_control:
        loop_var: hostname

    - name: Allow kubelet API and metrics traffic between cluster nodes
      community.general.ufw:
        rule: allow
        from_ip: "{{ hostvars[hostname].ansible_host }}"
        to_ip: any
        port: 10250
        proto: tcp
      loop: "{{ groups['k3s_cluster'] | difference([inventory_hostname]) }}"
      loop_control:
        loop_var: hostname

- hosts: servers
  become: true
  vars:
    ansible_ssh_private_key_file: "~/.ssh/{{inventory_hostname}}_private_key"
  tasks:
    - name: Allow Kubernetes API access from agent nodes
      community.general.ufw:
        rule: allow
        from_ip: "{{ hostvars[hostname].ansible_host }}"
        to_ip: any
        port: 6443
        proto: tcp
      loop: "{{ groups['agents'] }}"
      loop_control:
        loop_var: hostname